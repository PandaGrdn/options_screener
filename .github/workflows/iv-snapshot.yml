name: Daily paper trading

on:
  schedule:
    # ~4:30pm ET year-round (after US cash close). GHA cron is UTC and can slip ~15–60m.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:  # manual run from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Snapshot chains
        run: python snapshot.py

      - name: Fail if today has zero chain rows
        if: always()
        run: |
          python - <<'PY'
          import datetime as dt, os, sys
          import pandas as pd

          path = "chain_history.csv"
          today = dt.date.today().isoformat()
          if not os.path.exists(path):
              print(f"::error::{path} missing — snapshot wrote nothing")
              sys.exit(1)
          df = pd.read_csv(path)
          n = int((df["date"].astype(str) == today).sum())
          tickers = df.loc[df["date"].astype(str) == today, "ticker"].nunique()
          print(f"rows for {today}: {n} across {tickers} tickers")
          if n == 0:
              print(f"::error::zero rows for {today} — refusing silent green")
              sys.exit(1)
          PY

      - name: Paper run-daily (model decide → mark → report)
        if: success()
        run: python -m paper run-daily --max-new 1

      - name: Fail if report missing
        if: always()
        run: |
          test -s data/latest_report.txt || { echo "::error::latest_report.txt missing/empty"; exit 1; }

      - name: Commit and push to main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chain_history.csv data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: daily paper run $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
