name: Daily paper trading

on:
  schedule:
    # 2:55pm Pacific = 21:55 UTC = 5:55pm ET in summer (2:55pm PT winter).
    # After the 4:00pm ET cash close, with buffer for Yahoo + GHA cron slip.
    # Do not run during the US session — chains would be mid-day quotes.
    - cron: "55 21 * * 1-5"
  workflow_dispatch:  # manual run from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Snapshot chains + underlyings + earnings
        run: python snapshot.py

      - name: Fail if snapshot missing required asof rows
        if: always()
        run: |
          python - <<'PY'
          import datetime as dt
          import os, sys
          import pandas as pd
          from snapshot import previous_session_date, session_date

          asof = session_date()
          today = asof.isoformat()
          prev = previous_session_date(asof).isoformat()
          path = "chain_history.csv"
          if not os.path.exists(path):
              print(f"::error::{path} missing — snapshot wrote nothing")
              sys.exit(1)
          df = pd.read_csv(path)
          n = int((df["date"].astype(str) == today).sum())
          tickers = df.loc[df["date"].astype(str) == today, "ticker"].nunique()
          print(f"chain rows for {today} (same session): {n} across {tickers} tickers")
          if n == 0:
              print(f"::error::zero chain rows for {today} — refusing silent green")
              sys.exit(1)

          upath = "underlying_history.csv"
          if not os.path.exists(upath):
              print(f"::error::{upath} missing")
              sys.exit(1)
          udf = pd.read_csv(upath)
          m = int((udf["date"].astype(str) == prev).sum())
          ut = udf.loc[udf["date"].astype(str) == prev, "ticker"].nunique()
          print(f"underlying rows for {prev} (previous session): {m} across {ut} tickers")
          if m == 0:
              latest = str(udf["date"].astype(str).max())
              floor = (asof - dt.timedelta(days=4)).isoformat()
              print(f"no T-1 bar {prev}; latest stored {latest}")
              if latest < floor:
                  print(f"::error::underlying_history stale (latest {latest} < {floor})")
                  sys.exit(1)
              print(f"::notice::treating {latest} as holiday fallback")

          epath = "earnings_calendar.csv"
          if not os.path.exists(epath):
              print(f"::error::{epath} missing")
              sys.exit(1)
          edf = pd.read_csv(epath)
          em = int((edf["asof"].astype(str) == today).sum())
          print(f"earnings_calendar.csv: {em} rows for {today} (optional)")
          PY

      - name: Paper run-daily (model decide → mark → report)
        if: success()
        run: python -m paper run-daily --max-new 1

      - name: Fail if report missing
        if: success()
        run: |
          test -s data/latest_report.txt || { echo "::error::latest_report.txt missing/empty"; exit 1; }
          test -s data/dashboard.html || { echo "::error::dashboard.html missing/empty"; exit 1; }

      - name: Commit and push to main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chain_history.csv underlying_history.csv earnings_calendar.csv data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: daily paper run $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
